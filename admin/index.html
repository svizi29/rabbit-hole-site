/* Rabbit Hole Web — the shared look of the team pages (creative report,
   analytics, DAM). Same palette and type as Rabbit Hole's own landing page:
   near-black ground, violet accent, the blue-to-purple brand gradient of the
   app icon, Bricolage Grotesque / Hanken Grotesk / JetBrains Mono.
   Edit HERE, then run `node tools/rh-web/sync-brand.mjs`; each page carries a
   generated copy between its rh-brand markers. */
:root {
  --rh-ink: #08080a;
  --rh-s1: #0f0f13;
  --rh-s2: #15151b;
  --rh-s3: #1d1d25;
  --rh-s4: #26262f;
  --rh-line: rgba(255, 255, 255, 0.08);
  --rh-line-2: rgba(255, 255, 255, 0.14);
  --rh-line-3: rgba(255, 255, 255, 0.24);
  --rh-text: #f5f5f6;
  --rh-text-2: #c2c2cc;
  --rh-text-3: #8d8d99;
  --rh-text-4: #62626d;
  --rh-accent: #7c5cff;
  --rh-accent-2: #9d86ff;
  --rh-accent-text: #ab9bff;
  --rh-accent-soft: rgba(124, 92, 255, 0.16);
  --rh-accent-ink: #ffffff;
  --rh-grad: linear-gradient(120deg, #3f7fd6, #6f57d6 48%, #9a4fc0);
  --rh-good: #38d39a;
  --rh-warn: #f6b13e;
  --rh-bad: #ff6b7a;
  --rh-blue: #5b9cff;
  --rh-pink: #ff6fae;
  --rh-display: 'Bricolage Grotesque', 'Hanken Grotesk', system-ui, sans-serif;
  --rh-body: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --rh-mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  --rh-r-sm: 7px;
  --rh-r: 10px;
  --rh-r-lg: 14px;
  --rh-r-xl: 20px;
  color-scheme: dark;
}
html { background: var(--rh-ink); }
body { background: var(--rh-ink); color: var(--rh-text); font-family: var(--rh-body); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
::selection { background: rgba(124, 92, 255, 0.38); color: #fff; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--rh-s4); border-radius: 5px; border: 2px solid var(--rh-ink); }
::-webkit-scrollbar-thumb:hover { background: #34343f; }

.rh-lockup .rh-word { font: 700 19px/1.1 var(--rh-display); letter-spacing: -0.015em; white-space: nowrap; }
.rh-lockup .rh-word b { font-weight: 800; background: var(--rh-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* The other team pages, one click away. */
.rh-suite { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--rh-line); border-radius: 999px; background: var(--rh-s1); }
.rh-suite a { font: 500 12px/1 var(--rh-body); color: var(--rh-text-3); text-decoration: none; padding: 6px 11px; border-radius: 999px; white-space: nowrap; }
.rh-suite a:hover { color: var(--rh-text); }
.rh-suite a[aria-current] { color: var(--rh-text); background: var(--rh-s3); }
.rh-suite a:focus-visible { outline: 2px solid var(--rh-accent-2); outline-offset: 1px; }
.rh-suite a[hidden] { display: none; }
.rh-suite a.rh-admin { color: var(--rh-accent-2); }
.rh-suite a.rh-download { color: var(--rh-text); background: var(--rh-accent-soft); }
.rh-suite a.rh-download:hover { background: rgba(124, 92, 255, 0.28); }
/* The Mac / Windows choice behind "Download Rabbit Hole". */
.rh-dl { border: 1px solid var(--rh-line-2); border-radius: var(--rh-r-lg); background: var(--rh-s1); color: var(--rh-text); padding: 20px; width: min(420px, 92vw); font: 400 14px/1.5 var(--rh-body); }
.rh-dl::backdrop { background: rgba(0, 0, 0, 0.6); }
.rh-dl b { font: 700 18px/1.2 var(--rh-display); display: block; }
.rh-dl p { color: var(--rh-text-3); margin: 6px 0 14px; }
.rh-dl-os { display: flex; gap: 10px; }
.rh-dl-os a { flex: 1; display: flex; flex-direction: column; gap: 2px; padding: 14px; border: 1px solid var(--rh-line-2); border-radius: var(--rh-r); text-decoration: none; color: var(--rh-text); font: 600 15px/1.2 var(--rh-body); }
.rh-dl-os a:hover { border-color: var(--rh-accent); }
.rh-dl-os span { color: var(--rh-text-3); font: 400 12px/1.2 var(--rh-body); }
.rh-dl form { margin: 14px 0 0; text-align: right; }
.rh-dl button { background: none; border: 1px solid var(--rh-line-2); color: var(--rh-text-2); border-radius: var(--rh-r-sm); padding: 6px 12px; cursor: pointer; font: inherit; }

.rh-eyebrow { font: 500 11px/1.3 var(--rh-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--rh-text-3); }
.rh-num { font-family: var(--rh-display); font-variant-numeric: tabular-nums; }

@media (max-width: 760px) { .rh-suite { display: none; } }
@media (prefers-reduced-motion: reduce) { * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }

<style>
* { box-sizing: border-box; }
body { margin: 0; font-size: 14px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 16px; padding: 12px 24px; background: rgba(8, 8, 10, 0.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--rh-line); }
header .grow { flex: 1; }
.me { font: 500 12px/1.2 var(--rh-mono); color: var(--rh-text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
main { max-width: 1240px; margin: 0 auto; padding: 20px 24px 80px; display: flex; flex-direction: column; gap: 18px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--rh-line); overflow-x: auto; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 14px; color: var(--rh-text-3); cursor: pointer; font-weight: 600; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--rh-text); border-bottom-color: var(--rh-accent); }
.tabs button:focus-visible, .btn:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--rh-accent-2); outline-offset: 1px; }
.intro { color: var(--rh-text-2); max-width: 80ch; margin: 0; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.bar .grow { flex: 1; }

.scrim[hidden] { display: none; }

.field > label, .field > .lbl { font: 500 11px/1.3 var(--rh-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--rh-text-3); }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; background: var(--rh-ink); border: 1px solid var(--rh-line); border-radius: var(--rh-r-sm); }

.toast.bad { border-color: var(--rh-bad); color: var(--rh-bad); }
.toast[hidden] { display: none; }
.keyrow td:first-child b { display: block; }

.roles { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }

@media (max-width: 760px) {
  header { padding: 10px 16px; }
  main { padding: 16px 16px 80px; }

}

<style>
.gate { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; padding: 16px; background: radial-gradient(900px 500px at 50% -10%, rgba(124, 92, 255, 0.16), transparent 70%), var(--rh-ink); }
.gate[hidden] { display: none; }
.gate-card { width: min(380px, 100%); background: var(--rh-s1); border: 1px solid var(--rh-line-2); border-radius: var(--rh-r-xl); padding: 28px 24px 22px; display: flex; flex-direction: column; gap: 14px; }
.gate-card .org { margin: -6px 0 2px; color: var(--rh-text-3); }
.gate-card label { display: flex; flex-direction: column; gap: 6px; font: 500 11px/1.3 var(--rh-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--rh-text-3); }
.gate-card input { font: 400 15px/1.4 var(--rh-body); text-transform: none; letter-spacing: 0; color: var(--rh-text); padding: 10px 12px; }
.gate-card .btn.primary { padding: 10px 14px; font-size: 15px; }
.gate-msg { margin: 0; min-height: 1.45em; color: var(--rh-text-2); }
.gate-msg.bad { color: var(--rh-bad); }
.gate-msg.ok { color: var(--rh-good); }
.gate-links { display: flex; flex-wrap: wrap; gap: 8px 16px; }
.gate-links [hidden] { display: none; }
.gate-google { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 10px 14px; font-size: 15px; font-weight: 600; background: #fff; color: #1f1f1f; border-color: #fff; }
.gate-google:hover { background: #ececf1; }
.gate-google svg { width: 18px; height: 18px; flex: none; }
.gate-or { display: flex; align-items: center; gap: 10px; color: var(--rh-text-4); font: 500 11px/1 var(--rh-mono); text-transform: uppercase; letter-spacing: 0.08em; }
.gate-or::before, .gate-or::after { content: ''; flex: 1; border-top: 1px solid var(--rh-line-2); }
.gate-card.signed .gate-google, .gate-card.signed .gate-or, .gate-card.signed label, .gate-card.signed #gGo, .gate-card.signed #gForgot, .gate-card.signed #gCreate { display: none; }
.gate-dl[hidden] { display: none; }
.gate-dl p, .rh-dl .dl-msg { margin: 8px 0 0; color: var(--rh-text-3); }
.rh-dl-os a[aria-disabled] { opacity: 0.5; pointer-events: none; }
</style>
</head>
<body>
<div class="gate" id="gate">
  <form class="gate-card" id="gateForm" novalidate>
    <span class="rh-lockup"><span class="rh-icon" aria-hidden="true"></span><span class="rh-word">Rabbit Hole <b>Admin</b></span></span>
    <p class="org" id="gOrg"></p>
    <button type="button" class="btn gate-google" id="gGoogle"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 2.9-2.2 5.4-4.7 7.1l7.6 5.9c4.4-4.1 6.9-10.1 6.9-17.5z"/><path fill="#FBBC05" d="M10.6 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.2 0-11.5-4.2-13.4-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>Continue with Google</button>
    <div class="gate-or">or with email</div>
    <label>Email<input type="email" id="gEmail" autocomplete="username" required></label>
    <label>Password<input type="password" id="gPass" autocomplete="current-password" required></label>
    <p class="gate-msg" id="gMsg" role="status" aria-live="polite"></p>
    <div class="gate-dl" id="gDl" hidden></div>
    <button class="btn primary" id="gGo" type="submit">Sign in</button>
    <div class="gate-links">
      <button type="button" class="lnk" id="gForgot">Forgot password?</button>
      <button type="button" class="lnk" id="gCreate">Create your account</button>
      <button type="button" class="lnk" id="gResend" hidden>Send the confirmation link again</button>
      <button type="button" class="lnk" id="gOther" hidden>Use a different account</button>
    </div>
  </form>
</div>
<header>
  <a class="rh-lockup" href="#" onclick="return false"><span class="rh-icon" aria-hidden="true"></span><span class="rh-word">Rabbit Hole <b>Admin</b></span></a>
  <span class="grow"></span>
  
  <span class="me" id="me"></span>
  <button class="btn sm" id="dlBtn" hidden>Download Rabbit Hole</button>
  <button class="btn sm" id="signout" hidden>Sign out</button>
<dialog class="rh-dl" id="nwDl" aria-labelledby="nwDlT"><b id="nwDlT">Download Rabbit Hole</b><p>The North Watch version. It keeps itself up to date for the people on this list.</p><div id="nwDlBody"></div><form method="dialog"><button>Close</button></form></dialog>
</header>
<main>
  <div class="tabs" role="tablist">
    <button role="tab" data-tab="people" aria-selected="true">People</button>
    <button role="tab" data-tab="usage" aria-selected="false">Usage</button>
    <button role="tab" data-tab="keys" aria-selected="false">API keys</button>
    <button role="tab" data-tab="jira" aria-selected="false" hidden>Jira</button>
    <button role="tab" data-tab="games" aria-selected="false" hidden>Games</button>
    <button role="tab" data-tab="pipeline" aria-selected="false" hidden>Pipeline</button>
    <button role="tab" data-tab="log" aria-selected="false">Log</button>
  </div>
  <section id="tab-people"></section>
  <section id="tab-usage" hidden></section>
  <section id="tab-keys" hidden></section>
  <section id="tab-jira" hidden></section>
  <section id="tab-games" hidden></section>
  <section id="tab-pipeline" hidden></section>
  <section id="tab-log" hidden></section>
</main>

<div class="scrim" id="scrim" hidden><div class="panel" role="dialog" aria-modal="true" aria-labelledby="pTitle" id="panel"></div></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
var S = { data: null, list: [], groups: [], dirty: false, usage: null, usageDays: 30, audit: null, edit: null }

function $(id) { return document.getElementById(id) }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c] }) }
// rabbit-hole.video: signed in with Firebase (the accounts Rabbit Hole uses); each call goes to the
// admin's API deployment with the ID token, and the admin answers only its own admins.
var CFG = {"org":"The North Watch","key":"AIzaSyAJsIaH85pXipJLJ1X6g1BFuOL1D_IfMmw","api":"https://script.google.com/macros/s/AKfycbwH0U-UlwF5Zj1XxxVl9NydH6e_Uk2PJ7jPna2RTr1oyvyUYY_GzKqwOUoB6M88kfIaXw/exec","google":"https://script.google.com/macros/s/AKfycbxMIN1VFDJ2ebsNCSUxLcIgGAO9HW-sUttKg3WepCqvflQzfcluoPDRPUTPyStw8yIFqg/exec","project":"rabbit-hole-c05b3","authDomain":"rabbit-hole-c05b3.firebaseapp.com"}
var STORE = 'rh_admin_auth'
var FB = 'https://identitytoolkit.googleapis.com/v1/accounts'
function readS() { try { var s = JSON.parse(localStorage.getItem(STORE) || 'null'); return s && s.refreshToken ? s : null } catch (e) { return null } }
function writeS(s) { try { if (s) localStorage.setItem(STORE, JSON.stringify(s)); else localStorage.removeItem(STORE) } catch (e) { /* private window */ } }
var FB_MSG = {
  EMAIL_NOT_FOUND: 'No account with that email. Create one first.',
  INVALID_PASSWORD: 'Wrong password.',
  INVALID_LOGIN_CREDENTIALS: 'Wrong email or password.',
  USER_DISABLED: 'This account is switched off.',
  EMAIL_EXISTS: 'An account with that email already exists. Sign in, or reset the password.',
  INVALID_EMAIL: 'That is not a valid email address.',
  MISSING_PASSWORD: 'Enter a password.',
  TOO_MANY_ATTEMPTS_TRY_LATER: 'Too many tries. Wait a few minutes and try again.',
}
function plain(code) {
  var head = String(code).split(' : ')[0].trim()
  if (head === 'WEAK_PASSWORD') return 'Use a password of at least 6 characters.'
  return FB_MSG[head] || String(code).replace(/_/g, ' ').toLowerCase()
}
function post(url, body, form) {
  return fetch(url, { method: 'POST', headers: { 'Content-Type': form ? 'application/x-www-form-urlencoded' : 'application/json' }, body: form ? body : JSON.stringify(body) })
    .then(function (r) { return r.json().catch(function () { return {} }).then(function (j) { if (!r.ok) throw new Error(plain(j && j.error && j.error.message || 'HTTP ' + r.status)); return j }) })
}
function fbUrl(path) { return FB + ':' + path + '?key=' + encodeURIComponent(CFG.key) }
function keep(a) {
  var s = { email: String(a.email || '').toLowerCase(), idToken: a.idToken, refreshToken: a.refreshToken, expiresAt: Date.now() + Number(a.expiresIn || 3600) * 1000 - 60000 }
  writeS(s)
  return s
}
/** A current ID token, refreshed when it is about to expire; null when signed out. */
function idToken() {
  var s = readS()
  if (!s) return Promise.resolve(null)
  if (s.idToken && s.expiresAt > Date.now()) return Promise.resolve(s.idToken)
  return post('https://securetoken.googleapis.com/v1/token?key=' + encodeURIComponent(CFG.key), 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(s.refreshToken), true)
    .then(function (j) { s.idToken = j.id_token; s.refreshToken = j.refresh_token || s.refreshToken; s.expiresAt = Date.now() + Number(j.expires_in || 3600) * 1000 - 60000; writeS(s); return s.idToken })
    .catch(function () { writeS(null); return null })
}
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1)
  return idToken().then(function (tok) {
    if (!tok) { var e = new Error('Sign in again.'); gate(e.message, 'signin'); e.gated = true; throw e }
    return fetch(CFG.api, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'admin', fn: fn, args: args, idToken: tok }) })
      .then(function (r) { if (!r.ok) throw new Error('The admin did not answer (HTTP ' + r.status + '). Try again.'); return r.json() })
      .then(function (j) {
        if (j.ok) return j.result
        var e = new Error(j.message || j.error || 'Something went wrong.')
        if (j.reason) { gate(e.message, j.reason); e.gated = true }
        throw e
      })
  })
}

// Google: Firebase's popup (its SDK loads only when the button is pressed). The session it returns is kept
// like an email one, so the rest of the page does not care which way you signed in.
var googleSdk = null
function google_() {
  if (!googleSdk) googleSdk = Promise.all([import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'), import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js')]).then(function (m) {
    var app = m[0].initializeApp({ apiKey: CFG.key, authDomain: CFG.authDomain, projectId: CFG.project }, 'rh-admin')
    return { a: m[1], auth: m[1].initializeAuth(app, { persistence: m[1].inMemoryPersistence, popupRedirectResolver: m[1].browserPopupRedirectResolver }) }
  })
  return googleSdk
}
var GOOGLE_MSG = {
  'auth/popup-closed-by-user': 'The Google window was closed before signing in.',
  'auth/cancelled-popup-request': 'The Google window was closed before signing in.',
  'auth/popup-blocked': 'The browser blocked the Google window. Allow pop-ups for rabbit-hole.video and try again.',
  'auth/unauthorized-domain': 'Google sign-in is not allowed on this address yet.',
  'auth/account-exists-with-different-credential': 'This email already signs in another way. Use email and password.',
}

// ── The sign-in screen ──
var gateMode = 'signin'
function setMsg(t, kind) { var m = $('gMsg'); m.textContent = t || ''; m.className = 'gate-msg' + (kind ? ' ' + kind : '') }
function gate(msg, reason) {
  $('gate').hidden = false
  $('signout').hidden = true
  $('dlBtn').hidden = true
  var s = readS()
  if (s && !$('gEmail').value) $('gEmail').value = s.email
  setMsg(msg, reason ? 'bad' : '')
  $('gResend').hidden = reason !== 'verify'
  $('gOther').hidden = !(reason === 'verify' || reason === 'notadmin')
  // Signed in but not an admin: the people on the list download Rabbit Hole here (the admin decides who).
  var signed = reason === 'notadmin' && !!s
  $('gateForm').classList.toggle('signed', signed)
  $('gDl').hidden = !signed
  if (signed) { setMsg('Signed in as ' + s.email + '.'); renderDownloads($('gDl')) }
}

// ── Download Rabbit Hole (Gasper, 2026-10-11): North Watch installers for the people on the list ──
// The admin checks the sign-in and the list, and answers a GitHub link that works for a few minutes
// (its GitHub token never reaches this page); the browser then downloads it.
function nwApi(body) {
  return idToken().then(function (tok) {
    if (!tok) throw new Error('Sign in again.')
    return fetch(CFG.api, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ idToken: tok }, body)) })
      .then(function (r) { if (!r.ok) throw new Error('The admin did not answer (HTTP ' + r.status + '). Try again.'); return r.json() })
  })
}
function mb(n) { return Math.round(Number(n || 0) / 1048576) + ' MB' }
function renderDownloads(el) {
  el.innerHTML = '<p>Looking for the newest version…</p>'
  return nwApi({ action: 'download' }).then(function (j) {
    if (!j.ok) { el.innerHTML = '<p class="gate-msg bad">' + esc(j.message || j.error || 'Not available.') + '</p>'; return }
    var opt = function (os, name, sub, a) {
      return a ? '<a href="#" data-os="' + os + '">' + name + '<span>' + sub + ' · ' + esc(a.version) + ' · ' + mb(a.size) + '</span></a>'
        : '<a aria-disabled="true">' + name + '<span>Not published yet</span></a>'
    }
    el.innerHTML = '<div class="rh-dl-os">' + opt('mac', 'Mac', 'Apple silicon', j.mac) + opt('win', 'Windows', '64-bit', j.win) + '</div>' +
      (j.error ? '<p>' + esc(j.error) + '</p>' : '') + '<p class="dl-msg" role="status" aria-live="polite"></p>'
    Array.prototype.forEach.call(el.querySelectorAll('a[data-os]'), function (a) {
      a.onclick = function (ev) {
        ev.preventDefault()
        var os = a.getAttribute('data-os'), msg = el.querySelector('.dl-msg')
        msg.textContent = 'Starting the download…'
        nwApi({ action: 'download', os: os }).then(function (d) {
          if (!d.ok || !d.url) throw new Error(d.message || d.error || 'No download link.')
          msg.textContent = 'Downloading ' + d.name + ' (' + mb(d.size) + '). ' + (os === 'mac'
            ? 'Open the DMG and drag Rabbit Hole to Applications.'
            : 'Run the installer; if Windows asks, choose More info, then Run anyway.') + ' Then open Rabbit Hole and sign in with this account.'
          window.location.href = d.url
        }).catch(function (e) { msg.textContent = String(e && e.message || e) })
      }
    })
  }).catch(function (e) { el.innerHTML = '<p class="gate-msg bad">' + esc(String(e && e.message || e)) + '</p>' })
}
$('dlBtn').onclick = function () { $('nwDl').showModal(); renderDownloads($('nwDlBody')) }
function setMode(m) {
  gateMode = m
  $('gGo').textContent = m === 'create' ? 'Create account' : 'Sign in'
  $('gCreate').textContent = m === 'create' ? 'I already have an account' : 'Create your account'
  $('gPass').setAttribute('autocomplete', m === 'create' ? 'new-password' : 'current-password')
  setMsg('')
}
$('gOrg').textContent = CFG.org
$('gGoogle').onclick = function () {
  var btn = this; btn.disabled = true
  setMsg('Waiting for Google…')
  google_().then(function (g) {
    var p = new g.a.GoogleAuthProvider()
    p.setCustomParameters({ prompt: 'select_account' })
    return g.a.signInWithPopup(g.auth, p)
  }).then(function (cred) {
    var u = cred.user
    return u.getIdTokenResult().then(function (r) {
      keep({ email: u.email, idToken: r.token, refreshToken: u.refreshToken, expiresIn: String(Math.max(120, Math.floor((Date.parse(r.expirationTime) - Date.now()) / 1000))) })
      return start()
    })
  }).catch(function (e) { setMsg(GOOGLE_MSG[e && e.code] || String(e && e.message || e), 'bad') })
    .then(function () { btn.disabled = false })
}

var toastT
function toast(msg, bad) { var t = $('toast'); t.textContent = msg; t.className = 'toast' + (bad ? ' bad' : ''); t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { t.hidden = true }, bad ? 6000 : 2600) }
function fail(e) { toast(String(e && e.message || e).replace(/^Exception: /, ''), true) }
function when(iso) {
  if (!iso) return ''
  var d = new Date(iso), s = (Date.now() - d) / 1000
  if (s < 90) return 'just now'
  if (s < 3600) return Math.round(s / 60) + ' min ago'
  if (s < 86400) return Math.round(s / 3600) + ' h ago'
  if (s < 86400 * 14) return Math.round(s / 86400) + ' days ago'
  return d.toISOString().slice(0, 10)
}
function usd(n) { return '$' + (n >= 100 ? Math.round(n).toLocaleString('en') : n.toFixed(2)) }
function nameOf(e) { var p = (S.data.people || []).filter(function (x) { return x.e === e })[0]; return p && p.name || e.split('@')[0] }

function bindPeople() {
  var list = S.list
  $('find').oninput = function () {
    var q = this.value.toLowerCase()
    document.querySelectorAll('#ppl tr').forEach(function (tr) { tr.hidden = q && tr.textContent.toLowerCase().indexOf(q) < 0 })
  }
  document.querySelectorAll('#ppl [data-level]').forEach(function (s) { s.onchange = function () { list[+s.dataset.level].level = s.value; markDirty(); renderPeople() } })
  document.querySelectorAll('#ppl [data-k]').forEach(function (c) { c.onchange = function () { list[+c.dataset.i][c.dataset.k] = c.checked; markDirty(); renderPeople() } })
  document.querySelectorAll('#ppl [data-ug]').forEach(function (b) {
    b.onclick = function () { var p = list[+b.dataset.ug], g = b.dataset.g; p.g = p.g || []; var k = p.g.indexOf(g); if (k >= 0) p.g.splice(k, 1); else p.g.push(g); markDirty(); renderPeople() }
  })
  document.querySelectorAll('#ppl [data-rm]').forEach(function (b) {
    b.onclick = function () {
      if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'Remove?'; return }
      list.splice(+b.dataset.rm, 1); markDirty(); renderPeople()
    }
  })
  document.querySelectorAll('[data-mods]').forEach(function (b) { b.onclick = function () { openPerson(+b.dataset.mods) } })
  $('addpeople').onclick = function () {
    var level = $('newlevel').value, an = !!$('newan') && $('newan').checked, rp = !!$('newrp') && $('newrp').checked, app = $('newapp').checked, n = 0
    String($('newpeople').value || '').split(/[\s,;]+/).map(function (x) { return x.trim().toLowerCase() }).filter(function (x) { return /^[^@\s]+@[^@\s]+$/.test(x) }).forEach(function (e) {
      if (list.some(function (p) { return p.e === e })) return
      list.push({ e: e, name: '', level: level, an: an, rp: rp, app: app, g: [], m: null, status: 'active', note: '' }); n++
    })
    $('newpeople').value = ''
    if (n) { markDirty(); renderPeople(); toast('Added ' + n + ' — press Save people') }
  }
  $('newpeople').onkeydown = function (ev) { if (ev.key === 'Enter') $('addpeople').click() }
  $('savepeople').onclick = function () {
    var btn = this; btn.disabled = true; $('pmsg').textContent = 'Saving…'
    call('savePeople', list).then(function (d) { S.dirty = false; apply(d); toast('Saved') }).catch(function (e) { btn.disabled = false; $('pmsg').textContent = 'Not saved yet.'; fail(e) })
  }
  if ($('rpany')) $('rpany').onchange = function () {
    call('saveSettings', { reportAnyone: this.value === '1' }).then(function (s) { S.data.settings = s; toast('Saved') }).catch(fail)
  }
  if ($('damImport')) $('damImport').onclick = function () {
    if (S.dirty && !confirm('You have unsaved changes; they will be lost. Bring in the DAM’s people anyway?')) return
    if (!confirm('Add everyone on the DAM’s list with their DAM access, Analytics and Report ticks and DAM groups? Local app stays off except for admins: tick it for whoever uses Rabbit Hole. People already here keep their settings.')) return
    var btn = this; btn.disabled = true
    call('importDamPeople').then(function (r) { toast('Added ' + r.added + ' people, ' + r.groups + ' groups'); S.dirty = false; return reload() }).catch(fail).then(function () { var b = $('damImport'); if (b) b.disabled = false })
  }
  if ($('addgroup')) $('addgroup').onclick = function () { // only where this organisation has a DAM
    var n = $('newgroup').value.trim(); if (!n) return
    if (S.dirty) { toast('Save people first', true); return }
    call('saveGroups', S.groups.concat([{ name: n }])).then(function (d) { apply(d); toast('Group added') }).catch(fail)
  }
  document.querySelectorAll('[data-delg]').forEach(function (b) {
    b.onclick = function () {
      if (S.dirty) { toast('Save people first', true); return }
      if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'delete?'; return }
      var id = b.dataset.delg
      call('saveGroups', S.groups.filter(function (g) { return g.id !== id })).then(function (d) { apply(d); toast('Group deleted') }).catch(fail)
    }
  })
}

function renderUsage() {
  var u = S.usage, el = $('tab-usage')
  var per = {}, prov = {}, cats = {}, total = 0, calls = 0
  u.rows.forEach(function (r) {
    var x = per[r.e] || (per[r.e] = { e: r.e, n: 0, usd: 0, prov: {}, rows: [], last: '' })
    x.n += r.n; x.usd += r.usd; x.rows.push(r); if (r.last > x.last) x.last = r.last
    x.prov[r.p] = (x.prov[r.p] || 0) + r.usd
    prov[r.p] = prov[r.p] || { n: 0, usd: 0 }; prov[r.p].n += r.n; prov[r.p].usd += r.usd
    var c = r.cat || 'Other'; cats[c] = cats[c] || { n: 0, usd: 0 }; cats[c].n += r.n; cats[c].usd += r.usd
    total += r.usd; calls += r.n
  })
  var CAT_ORDER = ['Video', 'Image', 'Text & AI assistants', 'Audio', '3D', 'Upscale', 'Data', 'Other']
  // What a row used, where Rabbit Hole knows it (2.1+): images, seconds, tokens, characters.
  function used(r) {
    var o = []
    if (r.i) o.push(r.i.toLocaleString('en') + ' img')
    if (r.s) o.push(r.s >= 120 ? Math.round(r.s / 60).toLocaleString('en') + ' min' : Math.round(r.s) + ' s')
    if (r.t) o.push((r.t >= 1e6 ? (r.t / 1e6).toFixed(1) + 'M' : r.t >= 1e3 ? Math.round(r.t / 1e3) + 'k' : r.t) + ' tok')
    if (r.c) o.push(r.c.toLocaleString('en') + ' chars')
    return o.join(' · ')
  }
  // $0 rows: Higgsfield bills credits, Sensor Tower is a flat licence, anything else has no list price on file.
  function spend(r) { return r.usd > 0 ? usd(r.usd) : r.p === 'higgsfield' ? 'credits' : r.p === 'sensortower' ? 'calls' : usd(0) }
  var list = Object.keys(per).map(function (k) { return per[k] }).sort(function (a, b) { return b.usd - a.usd || b.n - a.n })
  var provs = Object.keys(prov).sort(function (a, b) { return prov[b].usd - prov[a].usd })
  var h = '<div class="bar"><div class="seg" id="uDays">' + [7, 30, 90].map(function (d) { return '<button type="button" data-d="' + d + '" aria-pressed="' + (S.usageDays === d) + '">' + d + ' days</button>' }).join('') + '</div>' +
    '<span class="grow"></span><span class="dim">Since ' + esc(u.from) + '</span></div>'
  h += '<div class="stats"><div class="card stat"><span class="rh-eyebrow">Estimated spend</span><span class="rh-num">' + usd(total) + '</span></div>' +
    '<div class="card stat"><span class="rh-eyebrow">Generations and calls</span><span class="rh-num">' + calls.toLocaleString('en') + '</span></div>' +
    '<div class="card stat"><span class="rh-eyebrow">People using it</span><span class="rh-num">' + list.length + '</span></div></div>'
  h += '<p class="intro">Each Rabbit Hole reports what it used with its hourly check: provider, model, how many and the estimated cost (Rabbit Hole\'s own price list, not the provider\'s invoice). Click a person for the models.</p>'
  var catList = CAT_ORDER.filter(function (c) { return cats[c] })
  if (catList.length) h += '<div class="card scroll"><table><thead><tr><th>Kind of work</th><th class="num">Calls</th><th class="num">Estimated</th></tr></thead><tbody>' +
    catList.map(function (c) { return '<tr><td>' + esc(c) + '</td><td class="num">' + cats[c].n.toLocaleString('en') + '</td><td class="num">' + usd(cats[c].usd) + '</td></tr>' }).join('') + '</tbody></table></div>'
  if (provs.length) h += '<div class="card scroll"><table><thead><tr><th>Provider</th><th class="num">Calls</th><th class="num">Estimated</th></tr></thead><tbody>' +
    provs.map(function (k) { return '<tr><td>' + esc(k) + '</td><td class="num">' + prov[k].n.toLocaleString('en') + '</td><td class="num">' + usd(prov[k].usd) + '</td></tr>' }).join('') + '</tbody></table></div>'
  h += '<div class="card scroll"><table><thead><tr><th>Person</th><th>By provider</th><th class="num">Calls</th><th class="num">Estimated</th><th class="hide-sm">Last used</th></tr></thead><tbody id="uRows">'
  list.forEach(function (x, i) {
    var chips = Object.keys(x.prov).sort(function (a, b) { return x.prov[b] - x.prov[a] }).map(function (k) { return '<span class="pill">' + esc(k) + ' ' + usd(x.prov[k]) + '</span>' }).join('')
    h += '<tr class="click" data-i="' + i + '"><td class="who"><b>' + esc(nameOf(x.e)) + '</b><span>' + esc(x.e) + '</span></td><td><div class="chips">' + chips + '</div></td><td class="num">' + x.n.toLocaleString('en') + '</td><td class="num">' + usd(x.usd) + '</td><td class="hide-sm">' + esc(x.last) + '</td></tr>'
    h += '<tr data-detail="' + i + '" hidden><td colspan="5"><table><thead><tr><th>Kind of work</th><th>Provider</th><th>Model</th><th>Kind</th><th class="hide-sm">Used</th><th class="num">Calls</th><th class="num">Estimated</th></tr></thead><tbody>' +
      x.rows.sort(function (a, b) { return CAT_ORDER.indexOf(a.cat || 'Other') - CAT_ORDER.indexOf(b.cat || 'Other') || b.usd - a.usd || b.n - a.n }).map(function (r) { return '<tr><td>' + esc(r.cat || 'Other') + '</td><td>' + esc(r.p) + '</td><td class="mono">' + esc(r.m || '—') + '</td><td>' + esc(r.k || '') + '</td><td class="hide-sm">' + esc(used(r) || '—') + '</td><td class="num">' + r.n.toLocaleString('en') + '</td><td class="num">' + spend(r) + '</td></tr>' }).join('') +
      '</tbody></table></td></tr>'
  })
  h += '</tbody></table>' + (list.length ? '' : '<div class="empty">Nothing reported in this period yet. Usage arrives once people run a Rabbit Hole that signs in here.</div>') + '</div>'
  el.innerHTML = h
  $('uDays').onclick = function (ev) { var b = ev.target.closest('button[data-d]'); if (!b) return; S.usageDays = Number(b.dataset.d); loadUsage() }
  $('uRows').onclick = function (ev) { var tr = ev.target.closest('tr[data-i]'); if (!tr) return; var d = el.querySelector('tr[data-detail="' + tr.dataset.i + '"]'); d.hidden = !d.hidden }
}

// The games a Studio project picks from (TSG). Only a game project shares with the TSG Elements library; Other is
// always offered and never shares. Rename or retire a game; a game is never removed (old projects use it).
function renderGames() {
  var el = $('tab-games')
  if (!S.games) S.games = (S.data.games || []).map(function (g) { return { id: g.id, name: g.name, codes: (g.codes || []).slice(), retired: !!g.retired, private: !!g.private, access: (g.access || []).slice() } })
  // Private games (Gasper, 2026-10-20): only the owner makes one, and picks who has it; nobody else by default.
  var own = S.data.me === S.data.owner
  var rows = S.games.map(function (g, i) {
    return '<tr><td><input data-gname="' + i + '" value="' + esc(g.name) + '" maxlength="40"></td>' +
      '<td class="muted">' + esc(g.id || 'new') + '</td>' +
      '<td><input data-gcodes="' + i + '" value="' + esc((g.codes || []).join(', ')) + '" placeholder="FC" size="8" title="Ticket codes, e.g. FC (comma-separated)"></td>' +
      '<td><label><input type="checkbox" data-gret="' + i + '"' + (g.retired ? ' checked' : '') + '> Retired</label></td>' +
      '<td><label title="Only you and the people listed have it: in Rabbit Hole, on the Pipeline page and the phone. It never shares with the TSG Elements library."><input type="checkbox" data-gpriv="' + i + '"' + (g.private ? ' checked' : '') + (own ? '' : ' disabled') + '> Private</label>' +
        (g.private ? '<br><input data-gacc="' + i + '" value="' + esc((g.access || []).join(', ')) + '" placeholder="Only you. Add emails to give access" size="34"' + (own ? '' : ' disabled') + '>' : '') + '</td>' +
      '<td>' + (g.id ? '' : '<button class="btn ghost" data-gdel="' + i + '">Remove</button>') + '</td></tr>'
  }).join('')
  el.innerHTML = '<div class="card"><p class="muted">The game a Studio project is for. Only projects with a game share their finals with the TSG Elements library; ' +
    '<b>Other</b> is always offered and never shares. A retired game stays on its old projects and is no longer offered for new ones. Games are never removed.</p>' +
    // What syncs (Gasper, 2026-10-20: "I pick which brands, which games, products get synced … anybody can have an offline brand").
    '<p class="muted">Games on this list sync to everyone\u2019s Rabbit Hole (a private one only to the people who have it). A brand whose game is not on the list stays on the computer that made it, and its name never leaves it.</p>' +
    '<table><thead><tr><th>Game</th><th>Id</th><th>Ticket codes</th><th></th><th>Access</th><th></th></tr></thead><tbody>' + rows + '<tr><td colspan="6" class="muted">Other (always there)</td></tr></tbody></table>' +
    '<p class="muted">Every game is everyone\u2019s. A <b>private</b> game is only yours and the people you list: nobody else sees it, its projects or its Pipeline orders, and it never goes to the team library.' + (own ? '' : ' Only the owner makes a game private.') + '</p>' +
    '<div class="row"><input id="gnew" placeholder="Add a game" maxlength="40"> <button class="btn ghost" id="gadd">Add</button> <button class="btn" id="gsave">Save games</button></div></div>'
  el.querySelectorAll('[data-gname]').forEach(function (x) { x.oninput = function () { S.games[+x.dataset.gname].name = x.value } })
  el.querySelectorAll('[data-gret]').forEach(function (x) { x.onchange = function () { S.games[+x.dataset.gret].retired = x.checked } })
  el.querySelectorAll('[data-gpriv]').forEach(function (x) { x.onchange = function () { S.games[+x.dataset.gpriv].private = x.checked; renderGames() } })
  el.querySelectorAll('[data-gacc]').forEach(function (x) { x.oninput = function () { S.games[+x.dataset.gacc].access = x.value.split(/[\s,;]+/).filter(Boolean) } })
  el.querySelectorAll('[data-gcodes]').forEach(function (x) { x.oninput = function () { S.games[+x.dataset.gcodes].codes = x.value.split(/[\s,]+/).filter(Boolean) } })
  el.querySelectorAll('[data-gdel]').forEach(function (x) { x.onclick = function () { S.games.splice(+x.dataset.gdel, 1); renderGames() } })
  $('gadd').onclick = function () { var v = $('gnew').value.trim(); if (v) { S.games.push({ name: v, codes: [], retired: false }); renderGames() } }
  $('gsave').onclick = function () {
    call('saveGames', S.games).then(function (list) { S.data.games = list; S.games = null; renderGames(); toast('Games saved') }).catch(fail)
  }
}

function renderKeysOnGoogle_() {
  var d = S.data, el = $('tab-keys')
  var byName = {}; d.keys.forEach(function (k) { byName[k.name] = k })
  var labelOf = {}; d.catalog.modules.forEach(function (m) { labelOf[m.id] = m.label })
  var h = '<p class="intro">The company keys Rabbit Hole hands to the people whose modules need them, with each hourly check. Values never show here, only their last four characters. ' +
    'To cut off someone who has left: remove them on People (their Rabbit Hole wipes the keys at its next check). If they may have copied a key, also make a new one at the provider, paste it here, and everyone still on the list gets it within the hour.</p>'
  h += '<details class="card" style="padding:12px 16px"' + (d.keys.some(function (k) { return k.set }) ? '' : ' open') + '><summary>Set them all at once from keys-internal.env</summary>' +
    '<p class="dim" style="margin:10px 0">Open keys-internal.env, copy all of it and paste it here. Only the company keys listed below are taken (by their INTERNAL_… names); everything else in the file is ignored, and nothing is kept of the pasted text.</p>' +
    '<textarea id="envText" spellcheck="false" autocomplete="off" style="font-family:var(--rh-mono);font-size:12px;min-height:120px" placeholder="INTERNAL_GEMINI_KEY=…"></textarea>' +
    '<div class="bar" style="margin-top:8px"><button class="btn primary" id="envGo">Set the keys</button></div></details>'
  h += '<div class="card scroll"><table><thead><tr><th>Key</th><th class="hide-sm">Used by</th><th>Value</th><th></th></tr></thead><tbody>'
  d.catalog.keys.forEach(function (k) {
    var s = byName[k.name] || {}
    var users = k.modules.indexOf('*') >= 0 ? 'Every module' : k.modules.map(function (id) { return labelOf[id] || id }).join(', ')
    if ((k.roles || []).length) users = (users ? users + '; ' : '') + 'admins'
    h += '<tr class="keyrow"><td><b>' + esc(k.label) + '</b><span class="mono dim">' + esc(k.name) + '</span></td><td class="hide-sm dim" style="max-width:340px">' + esc(users) + '</td>' +
      '<td>' + (s.set ? '<span class="pill ok">Set</span> <span class="mono">…' + esc(s.tail) + '</span>' + (s.at ? '<div class="dim" style="font-size:12px">' + when(s.at) + '</div>' : '') : '<span class="pill off">Not set</span>') + '</td>' +
      '<td style="white-space:nowrap"><button class="btn" data-set="' + esc(k.name) + '">' + (s.set ? 'Replace' : 'Set') + '</button>' + (s.set ? ' <button class="btn danger" data-clear="' + esc(k.name) + '">Clear</button>' : '') + '</td></tr>'
  })
  h += '</tbody></table></div>'
  el.innerHTML = h
  $('envGo').onclick = function () {
    var ta = $('envText'), text = ta.value; if (!text.trim()) return
    ta.value = ''
    var btn = this; btn.disabled = true
    call('importKeysEnv', text).then(function (r) { toast(r.set.length ? 'Set ' + r.set.length + ' keys' : 'No company keys found in that text', !r.set.length); return reload() })
      .catch(fail).then(function () { var b = $('envGo'); if (b) b.disabled = false })
  }
  el.onclick = function (ev) {
    var b = ev.target.closest('button[data-set],button[data-clear]'); if (!b) return
    var name = b.dataset.set || b.dataset.clear
    if (b.dataset.clear) {
      if (!confirm('Clear ' + name + '? Rabbit Hole stops receiving it, so the modules that need it stop working for everyone.')) return
      return call('setKey', name, '').then(function () { toast('Cleared'); return reload() }).catch(fail)
    }
    var v = prompt('New value for ' + name + ' (it will not be shown again):')
    if (v == null || !v.trim()) return
    call('setKey', name, v.trim()).then(function (r) { toast('Saved …' + r.tail); return reload() }).catch(fail)
  }
}

// ── Jira: who is who (people's open tickets in "New project from Jira ticket"; admins see everyone's) ──
var JIRA_HOW = { email: 'by e-mail', name: 'by name', admin: 'set by an admin', none: 'not found' }
function loadJira(fresh) {
  $('tab-jira').innerHTML = '<div class="empty">' + (fresh ? 'Matching everyone in Jira…' : 'Loading…') + '</div>'
  return call(fresh ? 'matchJiraUsers' : 'getJiraLinks', fresh === 'all').then(renderJira).catch(function (e) { $('tab-jira').innerHTML = '<div class="empty">' + esc(String(e && e.message || e)) + '</div>' })
}
function renderJira(d) {
  var h = '<p class="intro">Rabbit Hole shows each person the GROW tickets assigned to them when they start a project from a Jira ticket; admins see everyone’s, with a filter by person. Each e-mail is matched to a Jira account by e-mail, else by name. Correct a wrong or missing match here: your link always wins.</p>'
  if (!d.creds) h += '<p class="intro"><b>Set the Jira site, login e-mail and API token on the API keys tab first.</b></p>'
  h += '<div class="bar"><button class="btn primary" id="jMatch"' + (d.creds ? '' : ' disabled') + '>Match the unmatched</button><button class="btn" id="jMatchAll"' + (d.creds ? '' : ' disabled') + '>Match everyone again</button><span class="dim">Links set by an admin are kept.</span><button class="btn" id="jToBoard"' + (d.creds ? '' : ' disabled') + ' title="Rabbit Hole tickets still in New are off the Video board: move them to To Do">Move Rabbit Hole tickets to To Do</button></div>'
  h += '<div class="card scroll"><table><thead><tr><th>Person</th><th>Jira account</th><th class="hide-sm">How</th><th></th></tr></thead><tbody>'
  d.rows.forEach(function (r) {
    var j = r.jira
    h += '<tr><td class="who"><b>' + esc(r.name) + '</b><span>' + esc(r.e) + '</span></td>' +
      '<td>' + (j && j.id ? esc(j.name || j.id) : j ? '<span class="pill off">None</span>' : '<span class="dim">not matched yet</span>') + '</td>' +
      '<td class="hide-sm dim">' + (j ? esc(JIRA_HOW[j.id ? j.how : (j.how === 'admin' ? 'admin' : 'none')] || j.how) + (j.at ? ' · ' + when(j.at) : '') : '') + '</td>' +
      '<td style="white-space:nowrap"><button class="btn sm" data-jset="' + esc(r.e) + '">Set…</button>' + (j ? ' <button class="lnk" data-jclear="' + esc(r.e) + '">Forget</button>' : '') + ' <button class="lnk" data-jnone="' + esc(r.e) + '">No account</button></td></tr>'
  })
  h += '</tbody></table></div>'
  var el = $('tab-jira'); el.innerHTML = h
  $('jMatch').onclick = function () { loadJira(true) }
  $('jMatchAll').onclick = function () { if (confirm('Match everyone again? Links set by an admin are kept.')) loadJira('all') }
  $('jToBoard').onclick = function () {
    var b = this; b.disabled = true; b.textContent = 'Moving…'
    call('jiraRhToBoard').then(function (r) {
      b.textContent = r.moved.length + ' moved to To Do'
      var out = document.createElement('p'); out.className = 'intro'; out.id = 'jToBoardOut'
      out.textContent = (r.moved.length ? 'Moved: ' + r.moved.join(', ') + '. ' : '') + (r.failed.length ? 'Not moved: ' + r.failed.join(' · ') : (r.moved.length ? '' : 'No Rabbit Hole ticket was left in New.'))
      var old = $('jToBoardOut'); if (old) old.remove(); b.parentNode.insertAdjacentElement('afterend', out)
      toast(r.failed.length ? r.moved.length + ' moved; not moved: ' + r.failed.join(' · ') : (r.moved.length ? r.moved.length + ' tickets moved to To Do: ' + r.moved.join(', ') : 'No Rabbit Hole tickets were left in New.'), !!r.failed.length)
    }).catch(function (e) { b.disabled = false; b.textContent = 'Move Rabbit Hole tickets to To Do'; fail(e) })
  }
  el.onclick = function (ev) {
    var b = ev.target.closest('button[data-jset],button[data-jclear],button[data-jnone]'); if (!b) return
    if (b.dataset.jclear) return call('clearJiraUser', b.dataset.jclear, false).then(renderJira).catch(fail)
    if (b.dataset.jnone) return call('clearJiraUser', b.dataset.jnone, true).then(function (x) { toast('Marked: no Jira account'); renderJira(x) }).catch(fail)
    var q = prompt('Jira name, e-mail or account id for ' + b.dataset.jset + ':')
    if (q == null || !q.trim()) return
    call('setJiraUser', b.dataset.jset, q.trim()).then(function (r) {
      if (r.set) { toast('Linked'); renderJira(r.links) }
      else toast(r.candidates.length ? r.candidates.length + ' Jira people match: ' + r.candidates.join(', ') + '. Type the full name.' : 'Nobody in Jira matches that.', true)
    }).catch(fail)
  }
}

function apply(d) {
  S.data = d
  S.groups = d.groups || []
  if (!S.dirty) S.list = JSON.parse(JSON.stringify(d.people))
  $('me').textContent = d.me
  var a = document.querySelector('.rh-suite .rh-admin'); if (a) a.hidden = false
  var dl = document.querySelector('.rh-suite .rh-download'); if (dl) dl.hidden = false // admins always have the app
  var jt = document.querySelector('.tabs button[data-tab="jira"]'); if (jt) jt.hidden = !d.jira
  // Games: TSG's (the organisation whose Studio projects can share with the TSG Elements library).
  var gt = document.querySelector('.tabs [data-tab="games"]'); if (gt) gt.hidden = d.orgId !== 'tsg'
  var pt = document.querySelector('.tabs [data-tab="pipeline"]'); if (pt) pt.hidden = d.orgId !== 'tsg'
  // the top bar's ticked pages for whoever is looking: Future development (its own page since 2026-10-22), the CCC, Growth Daily
  var mine = (d.people || []).filter(function (p) { return p.e === d.me })[0], pg = (mine && mine.effective && mine.effective.pages) || {}
  var has = { future: !!(d.future && d.orgId === 'tsg'), command: !!pg.commandCenter, newsletter: !!pg.newsletter }
  document.querySelectorAll('.rh-suite [data-gate]').forEach(function (g) { g.hidden = !has[g.getAttribute('data-gate')] })
  S.games = null
  renderPeople(); renderKeys()
}
// ── Pipeline: the team's host (Phone.gs) ─────────────────────────────────────
// One Rabbit Hole makes the team's Pipeline work (Gasper, 2026-10-18: "my PC will make them, then upload to GDrive").
// ── Pipeline teams: who belongs to which team, for the filters on the Pipeline page and the phone (2026-10-20) ──
// a person as the team list shows them: their name, else their address before the @ ("agata.koptewicz" → "agata koptewicz")
function teamPerson(p) { return p.name || String(p.e).split('@')[0].replace(/[._]/g, ' ') }
function teamCount(t) { return t.members.length === 1 ? '1 person' : t.members.length + ' people' }
function renderPipeTeams(parent) {
  var box = document.createElement('div')
  box.className = 'card'
  box.innerHTML = '<div class="empty">Loading the teams…</div>'
  parent.appendChild(box)
  call('getPipeTeams').then(function (r) {
    S.pipeTeams = r.teams.map(function (t) { return { id: t.id, name: t.name, members: t.members.slice() } })
    S.pipePeople = r.people.slice().sort(function (a, b) { return (a.name || a.e).localeCompare(b.name || b.e) })
    drawTeams()
  }).catch(function (e) { box.innerHTML = '<div class="empty">' + esc(String(e && e.message || e)) + '</div>' })
  function drawTeams() {
    var teams = S.pipeTeams
    box.innerHTML = '<h3 style="margin:0 0 6px">Teams</h3><p class="dim" style="margin:0 0 12px">Put people in teams (UA, ASO, creative production…) to filter the Pipeline page and the phone app by team or by person. Teams change nobody\u2019s access.</p>' +
      teams.map(function (t, i) {
        return '<div style="border:1px solid var(--line,#2a2a30);border-radius:10px;padding:10px;margin-bottom:10px">' +
          '<div class="row"><input data-tname="' + i + '" value="' + esc(t.name) + '" maxlength="40" style="font-weight:600"> <span class="dim" data-tcount="' + i + '">' + teamCount(t) + '</span> <button class="btn ghost" data-tdel="' + i + '">Remove team</button></div>' +
          '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 12px;margin-top:8px">' +
          S.pipePeople.map(function (p) { return '<label title="' + esc(p.e) + '" style="display:flex;gap:6px;align-items:center;font-size:13px;min-width:0"><input type="checkbox" style="flex:none;width:auto" data-tm="' + i + '" value="' + esc(p.e) + '"' + (t.members.indexOf(p.e) >= 0 ? ' checked' : '') + '><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(teamPerson(p)) + '</span></label>' }).join('') +
          '</div></div>'
      }).join('') +
      '<div class="row"><input id="tnew" placeholder="New team, e.g. UA team" maxlength="40"> <button class="btn ghost" id="tadd">Add team</button> <button class="btn" id="tsave">Save teams</button></div>'
    box.querySelectorAll('[data-tname]').forEach(function (x) { x.oninput = function () { teams[+x.dataset.tname].name = x.value } })
    box.querySelectorAll('[data-tdel]').forEach(function (x) { x.onclick = function () { teams.splice(+x.dataset.tdel, 1); drawTeams() } })
    box.querySelectorAll('[data-tm]').forEach(function (x) { x.onchange = function () { var m = teams[+x.dataset.tm].members, i = m.indexOf(x.value); if (x.checked && i < 0) m.push(x.value); if (!x.checked && i >= 0) m.splice(i, 1); var c = box.querySelector('[data-tcount="' + x.dataset.tm + '"]'); if (c) c.textContent = teamCount(teams[+x.dataset.tm]) } })
    $('tadd').onclick = function () { var v = $('tnew').value.trim(); if (v) { teams.push({ name: v, members: [] }); drawTeams() } }
    $('tsave').onclick = function () { call('savePipeTeams', teams).then(function (list) { S.pipeTeams = list; drawTeams(); toast('Teams saved') }).catch(fail) }
  }
}

function renderPipelineHost() {
  var el = $('tab-pipeline')
  el.innerHTML = '<div class="empty">Loading…</div>'
  call('phoneHostState').then(function (st) {
    var h = st && st.host, when = function (s) { return s ? new Date(s).toLocaleString() : 'not yet' }
    var html = '<div class="card"><h3 style="margin:0 0 6px">The team\u2019s host</h3>' +
      '<p class="dim" style="margin:0 0 12px">The RH Server: the Rabbit Hole that makes everyone\u2019s Pipeline requests. People ticked <b>Own computers</b> can also pick their own Rabbit Holes in the app and on the page. People ticked <b>Pipeline</b> on the People tab ask for work and review and approve their own orders in Chrome or the phone app; <b>Pipeline: all</b> (and admins) see and decide on every order. Finished work goes to the host\u2019s Drive, into Rabbit Hole/Deliveries/<i>their name</i>/: everyone at Ten Square Games can open the Deliveries folder, and whoever asked can edit their own folder to move finals on (Rabbit Hole 2.1.72 or later on the RH Server).</p>' +
      (h ? '<p><b>' + esc(h.name) + '</b> \u00b7 connected ' + esc(when(h.at)) + ' by ' + esc(h.by) + ' \u00b7 last heard from ' + esc(when(h.seen)) + '</p>' +
        '<div class="bar"><button class="btn danger" id="hostOff">Disconnect</button></div>'
        : '<p>No RH Server yet: requests wait until one is ticked.</p>') +
      '<p class="dim" style="margin:10px 0 0">To make a computer the RH Server: in Rabbit Hole on it, signed in with an admin\u2019s work Google account, <b>Pipeline \u2192 Phone \u2192 Is RH Server</b>. Ticking it on another computer moves the RH Server there (Rabbit Hole asks first).</p>' +
      '<label style="display:flex;gap:8px;align-items:flex-start;margin-top:14px;cursor:pointer"><input type="checkbox" id="pipeMail"' + (st.mail ? ' checked' : '') + '> <span><b>Email the person who asked</b> when their order is ready to review or approve, or done (sent from the owner\u2019s account). Off: only the popup on the Pipeline page.</span></label>' +
      // once, the owner: the previews already on the board opened to the link (Phone.gs phoneMediaOpenTeam, 2026-10-26)
      (st.owner && h ? '<div class="bar" style="margin-top:14px"><button class="btn ghost" id="pubOpen">Open today\u2019s previews to the link</button></div>' +
        '<p class="dim" style="margin:6px 0 0">Once: the keyframes and cut previews already on the RH Server\u2019s board, of public games only (never a private game, Other or an unlisted game), open to anyone with the link, as delivered finals are, so the Pipeline page and the phone app load them straight from Drive. New ones open as they go up.</p>' : '') +
      '<p class="dim" style="margin-top:14px">The Pipeline page for the team: <a href="' + esc(st.url) + '" target="_blank">' + esc(st.url) + '</a></p></div>'
    el.innerHTML = html
    var po = $('pubOpen'); if (po) po.onclick = function () {
      if (!confirm('Open the previews of public games on the RH Server\u2019s board to anyone with the link (not findable)?')) return
      po.disabled = true
      call('phoneMediaOpenTeam').then(function (r) { po.disabled = false; toast(r.note || ('Opened ' + r.opened + (r.already ? ', ' + r.already + ' were already' : '') + (r.skipped ? ', ' + r.skipped + ' left closed' : '') + (r.failed ? ', ' + r.failed + ' failed' : '') + (r.left ? ', ' + r.left + ' to go: press it again' : ''))) }).catch(function (e) { po.disabled = false; fail(e) })
    }
    var pm = $('pipeMail'); if (pm) pm.onchange = function () { call('phoneMailSet', pm.checked).then(function (on) { toast(on ? 'Pipeline emails on' : 'Pipeline emails off') }).catch(function (e) { pm.checked = !pm.checked; fail(e) }) }
    var off = $('hostOff'); if (off) off.onclick = function () { if (confirm('Disconnect ' + h.name + '? Pipeline requests wait until a host is connected again.')) call('phoneHostDisconnect').then(function () { renderPipelineHost() }).catch(fail) }
    renderPipeTeams(el)
  }).catch(function (e) { el.innerHTML = '<div class="empty">' + esc(String(e && e.message || e)) + '</div>' })
}
function reload() { return call('getAdmin').then(apply) }
window.addEventListener('beforeunload', function (ev) { if (S.dirty) { ev.preventDefault(); ev.returnValue = '' } })
function start() {
  return idToken().then(function (t) {
    if (!t) { gate(''); return }
    setMsg('Opening…')
    return reload().then(function () { $('gate').hidden = true; $('signout').hidden = false; $('dlBtn').hidden = false; setMsg('') })
      .catch(function (e) { if (!e.gated) gate(String(e && e.message || e), 'error') })
  })
}
start()
</script>
</body>
</html>
